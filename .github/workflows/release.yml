name: Release

# Push a tag `v<version>` whose version equals `[workspace.package] version`
# in Cargo.toml. Each platform builds `openac` and `openac-launcher` in
# release mode and packages them; the last job writes `manifest.json` (the
# launcher's update feed, schema version 1) and publishes everything as one
# GitHub release.
#
# Assets per platform (<rid> is win-x64 or linux-x64):
#   openac-<rid>.zip    both programs, for players to download and unzip
#   client-<rid>.zip    `openac` at the root (the launcher's client payload)
#   launcher-<rid>.zip  `openac-launcher` at the root (its self-update payload)
# Every zip carries LICENSE, NOTICE.md, THIRD-PARTY-LICENSES.html (the license
# of every Rust crate compiled into the programs, generated by cargo-about from
# about.toml and about.hbs) and the bundled fonts' licenses under licenses/.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: check the tag against Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read and compare the version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[workspace\.package\]/ { section = 1; next }
            /^\[/ { section = 0 }
            section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME}"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match the workspace version ${version} (expected v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: build (${{ matrix.rid }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            # The C runtime linked in, so players need no Visual C++
            # redistributable. Applied to the target only (--target below),
            # not to build scripts or proc macros.
            rustflags: -C target-feature=+crt-static
          - rid: linux-x64
            # The oldest supported hosted image, so the binaries run on
            # distributions with an older glibc.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ''
            rustflags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libasound2-dev zip

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p openac -p openac-launcher

      - name: Smoke-test the binaries
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          "$bin/openac-launcher${{ matrix.exe }}" --verify-publish
          "$bin/openac${{ matrix.exe }}" --help > /dev/null

      - name: Install cargo-about
        shell: bash
        env:
          # A host tool: the release's static C runtime flag is not for it.
          RUSTFLAGS: ''
        run: cargo install --locked cargo-about --version 0.9.2 --features cli

      - name: Stage the license files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/common/licenses/egui-fonts
          cp LICENSE NOTICE.md staging/common/
          # Every crate compiled into the programs with its license text. A
          # license about.toml does not accept fails the release (--fail).
          cargo about generate --workspace --locked --fail \
            -c about.toml -o staging/common/THIRD-PARTY-LICENSES.html about.hbs
          test -s staging/common/THIRD-PARTY-LICENSES.html
          cp assets/fonts/NotoSans/OFL.txt staging/common/licenses/NotoSans-OFL.txt
          # The launcher's egui fonts: their license texts ship in the crate.
          fonts_manifest=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "epaint_default_fonts") | .manifest_path' \
            | head -n 1)
          # Forward slashes, so a Windows path also works in Git Bash.
          fonts_manifest=${fonts_manifest//\\//}
          fonts_dir="$(dirname "$fonts_manifest")/fonts"
          for file in OFL.txt UFL.txt Hack-Regular.txt emoji-icon-font-mit-license.txt; do
            cp "$fonts_dir/$file" staging/common/licenses/egui-fonts/
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $rid = '${{ matrix.rid }}'
          $bin = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          $packages = @{
            "client-$rid"   = @('openac.exe')
            "launcher-$rid" = @('openac-launcher.exe')
            "openac-$rid"   = @('openac.exe', 'openac-launcher.exe')
          }
          foreach ($name in $packages.Keys) {
            $dir = "staging/$name"
            Copy-Item -Recurse staging/common $dir
            foreach ($exe in $packages[$name]) { Copy-Item "$bin/$exe" $dir }
            $zip = (Join-Path (Get-Location) "dist/$name.zip")
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              (Resolve-Path $dir).Path, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          }
          Get-ChildItem dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          bin="target/${{ matrix.target }}/release"
          mkdir -p dist
          package() {
            name=$1; shift
            cp -r staging/common "staging/$name"
            for exe in "$@"; do
              install -m 0755 "$bin/$exe" "staging/$name/$exe"
            done
            # Info-ZIP keeps the Unix modes, so the executables extract with
            # their execute bit, as the launcher's extractor requires.
            (cd "staging/$name" && zip -r -X -q "../../dist/$name.zip" .)
          }
          package "client-$rid" openac
          package "launcher-$rid" openac-launcher
          package "openac-$rid" openac openac-launcher
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The launcher reads this strictly (crates/ac-launcher-core/src/updates/manifest.rs):
      # exactly these members, strict SemVer versions, a minimum launcher
      # version no newer than the release, HTTPS URLs, lowercase SHA-256 and a
      # size in bytes for each payload, keyed by runtime identifier. The
      # minimum is the release itself: a launcher older than the release
      # updates itself before it installs the new client.
      - name: Write manifest.json
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact() {
            file="dist/$1"
            jq -n --arg url "$BASE_URL/$1" \
                  --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
                  --argjson size "$(stat -c %s "$file")" \
                  '{url: $url, sha256: $sha256, size: $size}'
          }
          clients='{}'
          launchers='{}'
          for rid in win-x64 linux-x64; do
            clients=$(jq --arg rid "$rid" --argjson a "$(artifact "client-$rid.zip")" '. + {($rid): $a}' <<< "$clients")
            launchers=$(jq --arg rid "$rid" --argjson a "$(artifact "launcher-$rid.zip")" '. + {($rid): $a}' <<< "$launchers")
          done
          jq -n --arg version "$VERSION" \
                --argjson clients "$clients" \
                --argjson launchers "$launchers" \
                '{schemaVersion: 1, version: $version, minimumLauncherVersion: $version,
                  clients: $clients, launchers: $launchers}' > dist/manifest.json
          cat dist/manifest.json
          (cd dist && sha256sum *.zip manifest.json > SHA256SUMS.txt)

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "openac-rust $TAG" \
            --generate-notes \
            "${flags[@]}"
